---

# System packages required to install and run Home Assistant Core on Debian.
#
# Most of these are build dependencies: when Home Assistant installs the Python
# requirements of an integration at runtime, pip may have to compile wheels for
# packages with C extensions. Having the toolchain and the matching -dev headers
# present is what makes that runtime install reliable instead of flaky.
home_assistant_requirements:
  # interpreter, venv and build toolchain
  - python3-dev
  - python3-venv
  - python3-pip
  - python3-virtualenv
  - build-essential
  - autoconf
  - pkg-config
  - gcc
  # common -dev headers needed to build native wheels
  - libffi-dev
  - libssl-dev
  - libjpeg-dev
  - zlib1g-dev
  # image handling (PIL / pillow / turbojpeg)
  - libopenjp2-7
  - libtiff-dev
  - libturbojpeg0        # provides libturbojpeg.so for the PyTurboJPEG bindings
  # audio / video (camera, media, tts)
  - ffmpeg
  # bluetooth integrations
  - bluez
  # timezone data
  - tzdata

...
