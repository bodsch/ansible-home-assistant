---

# System packages are distribution specific and are defined in
# vars/<distribution>.yml (e.g. vars/debian.yml).
#
# Home Assistant manages the Python dependencies of every enabled INTEGRATION
# itself at runtime - and pins them to exact versions. We therefore do NOT
# pre-install integration packages (numpy, PyTurboJPEG, hassil, ...) by hand:
# unpinned "latest" versions clash with HA's pins and break the install (e.g.
# the wrong `turbojpeg` distribution shadowing `PyTurboJPEG`). Their matching
# native libs (libturbojpeg0, ...) come as system packages.
#
# The exception is `isal`: it is an OPTIONAL aiohttp compression accelerator,
# not an integration requirement, so HA never installs it on its own. Without it
# you get "zlib_ng and isal are not available, falling back to zlib" and slower
# HTTP compression. isal is a standalone leaf package shipping manylinux wheels,
# so seeding it is safe. (`zlib-ng` would work too; aiohttp needs only one.)
# If you ever hit an API mismatch, pin it to HA's value from
# {{ home_assistant_user.home }}/lib/python*/site-packages/homeassistant/package_constraints.txt
home_assistant_python_requirements:
  - name: wheel
  - name: isal

home_assistant_defaults_directory: /etc/default

home_assistant_defaults_service_config:
  config_directory: "{{ home_assistant_user.home }}"    # Directory that contains the Home Assistant configuration
  recovery_mode: ""                                     # Start Home Assistant in recovery mode
  debug: ""                                             #
  open_ui: ""                                           #
  skip_pip: ""                                          #
  skip_pip_packages: []                                 #
  verbose: ""                                           #
  log_rotate_days: "10"                                 #
  log_file: ""                                          #
  log_no_color: true                                    #
  ignore_os_check: ""                                   #
                                                        #
home_assistant_defaults_configuration:
  # default_config: ""
  assist_pipeline: ""
  backup: ""
  bluetooth: ""
  config: ""
  conversation: ""
  counter: ""
  dhcp: ""
  energy: ""
  hardware: ""
  history: ""
  homeassistant_alerts: ""
  image_upload: ""
  input_boolean: ""
  input_button: ""
  input_datetime: ""
  input_number: ""
  input_select: ""
  input_text: ""
  logbook: ""
  logger: "!include logger.yaml"
  map: ""
  my: ""
  network: ""
  person: ""
  schedule: ""
  stream: ""
  sun: ""
  system_health: ""
  tag: ""
  timer: ""
  usb: ""
  webhook: ""
  zone: ""
  frontend: "!include frontend.yaml"
  #  themes: "!include_dir_merge_named themes"
  automation: "!include automations.yaml"
  script: "!include scripts.yaml"
  scene: "!include scenes.yaml"

home_assistant_defaults_automation: []

home_assistant_defaults_logger:
  default: warning
  logs:
    homeassistant.core: warning
    homeassistant.components.mqtt: warning
    homeassistant.components.python_script: warning
    homeassistant.components.zha: warning
    aiohttp: error
    bellows.zigbee.application: warning
    bellows.ezsp: warning
    zigpy: warning
    zigpy_deconz.zigbee.application: warning
    zigpy_deconz.api: warning
    zigpy_xbee.zigbee.application: warning
    zigpy_xbee.api: warning
    zigpy_zigate: warning
    zigpy_znp: warning
    zhaquirks: warning
  filters:
    custom_components.my_integration:
      - "HTTP 429" # Filter all HTTP 429 errors
      - "Request to .*unreliable.com.* Timed Out"
    homeassistant.components.nws:
      - "^Error handling request$"

home_assistant_defaults_scenes: []
home_assistant_defaults_scripts: {}
home_assistant_defaults_secrets: {}

# ----------------------------------------------------------------------------------------

go_arch_map:
  x86_64: 'amd64'
  aarch64: 'arm64'
  armv7l: 'armv7'
  armv6l: 'armv6'

system_architecture: "{{ go_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}"

systemd_lib_directory: /lib/systemd/system

...
