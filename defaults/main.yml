---

home_assistant_version: 2026.2.3

home_assistant_user:
  owner: home-assistant
  group: home-assistant
  home: /opt/home-assistant

home_assistant_port: 8123

home_assistant_service_config: {}

home_assistant_configuration: {}
home_assistant_automation: []
home_assistant_logger: {}
home_assistant_scenes: []
home_assistant_scripts: {}
home_assistant_secrets: {}

home_assistant_groups:
  - dialout

# ----------------------------------------------------------------------------------------
# Headless onboarding
#
# Pre-seeds Home Assistant's .storage so the WebUI onboarding wizard is skipped.
# Only takes effect on a FRESH instance: if .storage/auth already exists the
# whole step is skipped and no live state is touched.
home_assistant_onboarding:
  enabled: false
  owner:
    name: "Admin"
    username: "admin"
    password: ""              # REQUIRED when enabled - set via ansible-vault
    language: "en"
  # Optional long-lived access token for later REST API automation. When enabled
  # the generated bearer token is written to `dest` (mode 0600) on the target.
  access_token:
    enabled: false
    name: "ansible"
    dest: "{{ home_assistant_user.home }}/.ansible_access_token"
  # Seeding .storage/person is intentionally OFF: that store carries active
  # schema migrations, and Home Assistant creates a person for the owner by
  # itself on first start. Only enable this if you also pin person.minor_version
  # under `schema` below to the exact value your HA release uses - otherwise
  # HA's migration crashes (KeyError: 'persons').
  person:
    enabled: false
  # Location / units rendered into the `homeassistant:` block of
  # configuration.yaml. Leave empty to keep HA defaults. Supported keys:
  # name, latitude, longitude, elevation, unit_system, time_zone, currency,
  # country, language.
  location: {}
  # Storage schema versions. VERIFY these against an instance you onboarded
  # manually (`cat /opt/home-assistant/.storage/<file>`) and override if your
  # Home Assistant release uses different values.
  schema:
    auth: {version: 1, minor_version: 1}
    auth_provider: {version: 1, minor_version: 1}
    onboarding: {version: 4, minor_version: 1}
    person: {version: 1, minor_version: 2}

...
